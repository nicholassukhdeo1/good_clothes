<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>good_clothes — set up</title>
    <style>
      :root { --green: #1e8e3e; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f6f7f5;
        color: #202124;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 520px;
        max-width: 92vw;
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
        padding: 36px 36px 32px;
      }
      .brand { font-weight: 800; font-size: 20px; letter-spacing: 0.01em; }
      .dot { color: var(--green); }
      h1 { font-size: 22px; margin: 18px 0 6px; }
      p.sub { margin: 0 0 22px; color: #5f6368; line-height: 1.5; }
      label { display: block; font-weight: 600; font-size: 13px; margin-bottom: 8px; }
      select {
        width: 100%;
        padding: 12px 14px;
        font-size: 15px;
        border: 1px solid #d6d9d6;
        border-radius: 10px;
        background: #fff;
        cursor: pointer;
      }
      .hint { margin-top: 10px; color: #5f6368; font-size: 13px; line-height: 1.5; min-height: 38px; }
      button {
        margin-top: 22px;
        width: 100%;
        padding: 13px;
        font-size: 15px;
        font-weight: 700;
        color: #fff;
        background: var(--green);
        border: 0;
        border-radius: 10px;
        cursor: pointer;
      }
      button:hover { background: #18762f; }
      .saved { margin-top: 14px; text-align: center; color: var(--green); font-weight: 600; min-height: 20px; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="brand">good<span class="dot">_</span>clothes</div>
      <h1>What's your style?</h1>
      <p class="sub">
        When an item scores low, good_clothes suggests more-conscious alternatives that
        <strong>look like it</strong>. Pick a lane and we'll match brands to your taste.
        You can change this anytime from the extension popup.
      </p>

      <label for="pref">Recommend brands that are…</label>
      <select id="pref"></select>
      <div class="hint" id="hint"></div>

      <button id="save">Save & start</button>
      <div class="saved" id="saved"></div>
    </div>

    <script src="prefs.js"></script>
    <script src="onboarding.js"></script>
  </body>
</html>
