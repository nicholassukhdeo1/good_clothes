<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>good_clothes — set up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Newsreader:ital,opsz,wght@0,18..72,400;0,18..72,500;1,18..72,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink-900: #1a1916; --ink-700: #44423c; --ink-500: #6f6c63;
      --ink-300: #a8a399; --ink-200: #e3e0d6; --ink-100: #efece4;
      --paper: #fff; --paper-warm: #f7f6f2; --accent: #2f5d3a; --accent-hover: #264b2f;
      --serif: "Newsreader", Georgia, serif;
      --sans: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: var(--paper-warm); color: var(--ink-900); font-family: var(--sans);
      padding: 24px;
    }

    .card {
      width: 560px; max-width: 96vw; background: var(--paper);
      border-radius: 18px; box-shadow: 0 12px 40px rgba(26,25,22,0.14);
      display: flex; flex-direction: column; overflow: hidden;
    }

    /* ---- header ---- */
    .card-head { padding: 28px 32px 0; }
    .brand { font-weight: 800; font-size: 18px; letter-spacing: 0.01em; }
    .brand i { font-style: normal; color: var(--accent); }
    .eyebrow {
      margin-top: 20px; font-size: 10px; letter-spacing: 0.14em;
      text-transform: uppercase; color: var(--accent); font-weight: 700;
    }
    h1 { font-family: var(--serif); font-weight: 500; font-size: 26px; line-height: 1.1; margin: 6px 0 4px; }
    .sub { color: var(--ink-500); font-size: 13.5px; line-height: 1.5; margin-bottom: 16px; }

    /* ---- chat area ---- */
    .chat-wrap { flex: 1; overflow-y: auto; padding: 16px 32px; min-height: 260px; max-height: 340px; }

    .bubble-row { display: flex; margin-bottom: 12px; }
    .bubble-row.user { justify-content: flex-end; }
    .bubble-row.assistant { justify-content: flex-start; }

    .bubble {
      max-width: 80%; padding: 10px 14px; border-radius: 16px;
      font-size: 14px; line-height: 1.5;
    }
    .bubble-row.user .bubble {
      background: var(--accent); color: #fff; border-bottom-right-radius: 4px;
    }
    .bubble-row.assistant .bubble {
      background: var(--ink-100); color: var(--ink-900); border-bottom-left-radius: 4px;
    }
    .bubble-row.assistant .bubble.typing {
      color: var(--ink-300); font-style: italic;
    }

    /* ---- input row ---- */
    .input-row {
      display: flex; gap: 8px; padding: 12px 32px 16px;
      border-top: 1px solid var(--ink-100);
    }
    #msg-input {
      flex: 1; padding: 10px 14px; font-family: var(--sans); font-size: 14px;
      color: var(--ink-900); background: var(--paper); border: 1px solid var(--ink-200);
      border-radius: 10px; outline: none; resize: none; height: 42px;
      transition: border-color 120ms;
    }
    #msg-input:focus { border-color: var(--accent); }
    #msg-input::placeholder { color: var(--ink-300); }
    #send-btn {
      padding: 0 18px; background: var(--accent); color: #fff; border: 0;
      border-radius: 10px; font-family: var(--sans); font-size: 14px; font-weight: 700;
      cursor: pointer; transition: background 120ms; white-space: nowrap;
    }
    #send-btn:hover { background: var(--accent-hover); }
    #send-btn:disabled { opacity: 0.4; cursor: default; }

    /* ---- style brief preview ---- */
    .brief-wrap {
      margin: 0 32px 16px; padding: 14px 16px; background: var(--ink-100);
      border-radius: 12px; display: none;
    }
    .brief-wrap.visible { display: block; }
    .brief-label {
      font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase;
      font-weight: 700; color: var(--accent); margin-bottom: 6px;
    }
    .brief-text {
      font-family: var(--serif); font-style: italic; font-size: 14px;
      color: var(--ink-700); line-height: 1.5;
    }

    /* ---- save button ---- */
    .save-wrap { padding: 0 32px 28px; }
    #save-btn {
      width: 100%; padding: 13px; font-family: var(--sans); font-size: 15px;
      font-weight: 700; color: #fff; background: var(--accent); border: 0;
      border-radius: 10px; cursor: pointer; transition: background 120ms, opacity 120ms;
      opacity: 0.35; pointer-events: none;
    }
    #save-btn.ready { opacity: 1; pointer-events: auto; }
    #save-btn.ready:hover { background: var(--accent-hover); }
    .saved-msg { margin-top: 10px; text-align: center; color: var(--accent); font-size: 13px; font-weight: 600; min-height: 18px; }
  </style>
</head>
<body>
<div class="card">
  <div class="card-head">
    <div class="brand">good<i>_</i>clothes</div>
    <div class="eyebrow">Set up · Style profile</div>
    <h1>What's your aesthetic?</h1>
    <p class="sub">Tell me about your style and I'll tune alternative recommendations to actually match your taste.</p>
  </div>

  <div class="chat-wrap" id="chat-wrap"></div>

  <div class="input-row">
    <input id="msg-input" type="text" placeholder="Describe your style…" autocomplete="off" />
    <button id="send-btn">Send</button>
  </div>

  <div class="brief-wrap" id="brief-wrap">
    <div class="brief-label">Your style brief</div>
    <div class="brief-text" id="brief-text"></div>
  </div>

  <div class="save-wrap">
    <button id="save-btn">Save &amp; Start Shopping</button>
    <div class="saved-msg" id="saved-msg"></div>
  </div>
</div>

<script src="prefs.js"></script>
<script src="onboarding.js"></script>
</body>
</html>
