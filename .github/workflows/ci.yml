# Two tiers, split by what they cost.
#
# `checks` is everything that is deterministic and free: lint, both unit suites,
# and the offline half of the injection eval. It runs on every push and every
# pull request, and it is allowed to block.
#
# `evals` drives the real model. It cannot run per-push - it costs money, it is
# nondeterministic, and a flaky third-party API must never be what fails someone's
# pull request - so it runs on a schedule and on demand, and writes its numbers
# into the job summary. The variance eval is not here at all: it needs Browserbase
# and the live web, 30 brands x n runs at ~20s each, and belongs in a deliberate
# run rather than on a timer.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # 06:12 UTC. Off the hour on purpose: scheduled runners are busiest at :00.
    - cron: "12 6 * * *"
  workflow_dispatch:
    inputs:
      live_injection:
        description: "Run the live injection A/B against the real model"
        type: boolean
        default: true

jobs:
  checks:
    name: lint and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Backend unit tests
        working-directory: backend
        # No keys: conftest.py supplies dummies and every external call is mocked.
        run: pytest tests/ -q

      - name: Materials scoring tests
        run: node extension/tests/test_materials.js

      - name: Injection eval (offline)
        working-directory: backend
        # --check fails the build if a payload escapes the evidence fence or the
        # detectors rot past their floor.
        run: python -m evals.run_injection --check --no-save | tee -a "$GITHUB_STEP_SUMMARY"

  evals:
    name: live evals
    # Pull requests from forks cannot see secrets, and a skipped-but-green job is
    # worse than no job, so this one only runs where the key can exist.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version-file: backend/.python-version
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check for an API key
        id: key
        run: |
          if [ -n "${{ secrets.ANTHROPIC_API_KEY }}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "ANTHROPIC_API_KEY is not configured - skipping the live arm." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Injection eval (live A/B)
        if: steps.key.outputs.present == 'true'
        working-directory: backend
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # The live injection arm serves corpus pages instead of browsing, so it
          # needs no Browserbase session. These only satisfy config.py at import.
          BROWSERBASE_API_KEY: unused-by-this-eval
          BROWSERBASE_PROJECT_ID: unused-by-this-eval
        run: python -m evals.run_injection --live | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: steps.key.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: backend/evals/results/
          if-no-files-found: warn
